<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suscripción a Promociones - Siman El Salvador</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo">SIMAN</div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="promociones.html">Promociones</a></li>
        <li><a href="contacto.html" class="active">Suscripción</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Suscríbete para Recibir Ofertas</h2>

    <div class="form-box">
      <p style="margin-bottom: 1.5rem; color: #555; text-align: center;">Regístrate para recibir cupones de descuento exclusivos y notificaciones de los Shopping Days de Siman El Salvador.</p>
      
      <form action="#" method="POST">
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Martínez" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="sucursal">Sucursal de Preferencia en El Salvador</label>
          <select id="sucursal" name="sucursal">
            <option value="galerias">Siman Galerías</option>
            <option value="metrocentro">Siman Metrocentro San Salvador</option>
            <option value="la-gran-via">Siman La Gran Vía</option>
            <option value="santa-ana">Siman Santa Ana</option>
            <option value="san-miguel">Siman San Miguel</option>
          </select>
        </div>

        <div class="form-group">
          <label for="interes">Categoría Favorita</label>
          <select id="interes" name="interes">
            <option value="moda">Moda y Accesorios</option>
            <option value="tecnologia">Tecnología y Audio</option>
            <option value="hogar">Hogar y Muebles</option>
            <option value="belleza">Cosméticos y Fragancias</option>
          </select>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 1rem;">Unirme a la Lista de Suscriptores</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Almacenes Siman El Salvador. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
